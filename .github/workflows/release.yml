name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # VS Code Marketplace Trusted Publishing (vsce --oidc)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Package VSIX
        id: package
        run: npm run package:ci

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: "*.vsix"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Both registries publish the same VSIX; one failing does not skip the other.
      - name: Publish to VS Code Marketplace
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: npx vsce publish --packagePath *.vsix --oidc

      - name: Publish to Open VSX
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish *.vsix -p "$OVSX_PAT"
